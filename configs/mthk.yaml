  data.conditions[neg-200MV].replicas[2].protocol.charge_scaling:
    origin: detected
    basis: '|q| of the monovalent permeant in the topology = 0.7800 e'
  data.conditions[neg-200MV].replicas[2].protocol.forcefield:
