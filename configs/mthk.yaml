  data.conditions[neg-200MV].replicas[1].protocol.voltage_mV:
    origin: declared
    basis: condition folder name neg-200MV
  data.conditions[neg-200MV].replicas[2].lineage:
    origin: declared
    basis: 'declared: each replica is an independent assembly. In the 500mV set the replicas carry distinct
