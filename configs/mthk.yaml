system:
  id: mthk
  architecture: k_filter_channel
  permeant: POT
  arch_profile:
    n_subunits: 4
    filter_present: true
    filter_motif: TVGYG
    n_sites: 5
    sites_basis: motif_rings
data:
  data_root: /path/to/data/CHARMM-ECC-078
  conditions:
  - id: 200MV
    direction: 1
    replicas:
    - id: '1'
      topology: /path/to/data/CHARMM-ECC-078/200MV/1/md_1.tpr
      trajectory: /path/to/data/CHARMM-ECC-078/200MV/1/fixed_c.xtc
      events: null
      lineage: 200MV/1
      protocol:
        forcefield: CHARMM36
        water_model: null
        charge_scaling: 0.78
        voltage_mV: 200.0
        temperature_K: 323.15
    - id: '2'
      topology: /path/to/data/CHARMM-ECC-078/200MV/1/md_1.tpr
      trajectory: /path/to/data/CHARMM-ECC-078/200MV/2/fixed_c.xtc
      events: null
      lineage: 200MV/2
      protocol:
        forcefield: CHARMM36
        water_model: null
        charge_scaling: 0.78
        voltage_mV: 200.0
        temperature_K: 323.15
  - id: neg-200MV
    direction: -1
    replicas:
    - id: '1'
      topology: /path/to/data/CHARMM-ECC-078/200MV/1/md_1.tpr
      trajectory: /path/to/data/CHARMM-ECC-078/neg-200MV/1/fixed_c.xtc
      events: null
      lineage: neg-200MV/1
      protocol:
        forcefield: CHARMM36
        water_model: null
        charge_scaling: 0.78
        voltage_mV: -200.0
        temperature_K: 323.15
    - id: '2'
      topology: /path/to/data/CHARMM-ECC-078/200MV/1/md_1.tpr
      trajectory: /path/to/data/CHARMM-ECC-078/neg-200MV/2/fixed_c.xtc
      events: null
      lineage: neg-200MV/2
      protocol:
        forcefield: CHARMM36
        water_model: null
        charge_scaling: 0.78
        voltage_mV: -200.0
        temperature_K: 323.15
  selections:
    ion: resname POT
    ion_negative: resname CLA
    water_oxygen: resname SOL and element O
    water_hydrogen: resname SOL and element H
    phosphate: resname POPE and element P
    lipid: resname POPE
    channel: not resname CLA POPE POT SOL
    anchor: (not resname CLA POPE POT SOL) and name CA and resid 43 44 45 46 47 127 128 129 130 131 211
      212 213 214 215 295 296 297 298 299
  pore:
    axis: z
    cylinder_radius_A: 4.6
    crossing_cylinder_radius_A: 10.0
    z_low_offset_A: -29.0
    z_high_offset_A: 13.0
    bin_low_offset_A: -25.0
    bin_width_A: 4.25
  stride: 5
events:
  source: own
labels:
  tau_ps:
  - 1000.0
  - 2000.0
  - 4000.0
  primary_tau_ps: 2000.0
features:
  window_ps: 2000.0
  coordination_cutoff_A: 3.424999999999995
  site_sigma_A: 1.54
  mouth_radius_A: 12.0
model:
  seed: 20260814
  trees:
    depth_grid:
    - 3
    k_events_grid:
    - 4.0
    colsample_grid:
    - 0.7
    subsample_grid:
    - 0.8
  monotone:
    geo_r_constriction_A: 1
evaluate:
  alarm:
    smooth_ps: 1000.0
origins:
  data.conditions:
    origin: detected
    basis: 'discovered on disk under /path/to/data/CHARMM-ECC-078: 200MV: 2 replicas;
      neg-200MV: 2 replicas'
  data.conditions[200MV].direction:
    origin: detected
    basis: 'sign of the net permeant flux across replicas: [1, 1]'
  data.conditions[200MV].replicas[1].lineage:
    origin: declared
    basis: 'declared: each replica is an independent assembly. In the 500mV set the replicas carry distinct
      measured currents in their file names (independent runs); MthK replicas sit in separate run folders.
      If a common equilibrated ancestor is known, merge the lineage manually'
  data.conditions[200MV].replicas[1].protocol.charge_scaling:
    origin: detected
    basis: '|q| of the monovalent permeant in the topology = 0.7800 e'
  data.conditions[200MV].replicas[1].protocol.forcefield:
    origin: declared
    basis: dataset name CHARMM-ECC-078
  data.conditions[200MV].replicas[1].protocol.temperature_K:
    origin: detected
    basis: ref-t of the thermostat read from the run tpr with gmx dump (GROMACS in the separate 'gmx'
      conda environment)
  data.conditions[200MV].replicas[1].protocol.voltage_mV:
    origin: declared
    basis: condition folder name 200MV
  data.conditions[200MV].replicas[2].lineage:
    origin: declared
    basis: 'declared: each replica is an independent assembly. In the 500mV set the replicas carry distinct
