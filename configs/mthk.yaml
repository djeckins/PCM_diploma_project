  data.data_root:
    origin: detected
    basis: 'discovered on disk under /path/to/data/CHARMM-ECC-078: 200MV: 2 replicas;
      neg-200MV: 2 replicas'
  data.pore.axis:
    origin: detected
    basis: 'emptiness of the central third between leaflets from phosphates on 7 frames: {''x'': 7.2,
      ''y'': 7.7, ''z'': 100.0}; best-over-second margin 13×'
  data.pore.bin_low_offset_A:
    origin: detected
    basis: '5–95 percentiles of channel axial coordinates from the anchor on 5 frames: [-24.3, 8.5] A'
  data.pore.bin_width_A:
    origin: detected
    basis: (9.0--25.0)/8 bins
  data.pore.crossing_cylinder_radius_A:
    origin: declared
    basis: 'task definition: separates ''crossed through the pore'' from ''crossed the bilayer past the
      channel''; 10 A covers the vestibules of both channels and is well under half the protein-protein
      spacing in the membrane'
  data.pore.cylinder_radius_A:
    origin: detected
    basis: median of the maximum search R(z) over 3 frames [3.0, 3.91, 3.11] + 1.5 A margin
  data.pore.z_high_offset_A:
    origin: detected
    basis: '5–95 percentiles of channel axial coordinates from the anchor on 5 frames: [-24.3, 8.5] A;
      +4 A at the mouth'
  data.pore.z_low_offset_A:
    origin: detected
    basis: '5–95 percentiles of channel axial coordinates from the anchor on 5 frames: [-24.3, 8.5] A;
      −4 A at the mouth'
  data.selections.anchor:
    origin: detected
    basis: CA atoms of the filter motif residues (resid [43, 44, 45, 46, 47, 127, 128, 129, 130, 131,
      211, 212, 213, 214, 215, 295, 296, 297, 298, 299])
  data.selections.channel:
    origin: detected
    basis: 'by composition: cations [''POT''] (|q|=[0.78]), anions [''CLA''], water [''SOL''] (O+2H, n=17700),
      lipid [''POPE''] ([125] atoms × [177]), channel by subtraction: [''ACE'', ''ALA'', ''ARG'', ''ASP'',
      ''CYS'', ''GLU'', ''GLY'', ''HSD'']…'
  data.selections.ion:
    origin: detected
    basis: 'by composition: cations [''POT''] (|q|=[0.78]), anions [''CLA''], water [''SOL''] (O+2H, n=17700),
      lipid [''POPE''] ([125] atoms × [177]), channel by subtraction: [''ACE'', ''ALA'', ''ARG'', ''ASP'',
