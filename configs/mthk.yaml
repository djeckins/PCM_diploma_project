    basis: selectivity filter rings
  system.architecture:
    origin: detected
    basis: K-type selectivity filter found
  system.permeant:
    origin: detected
    basis: 'per-particle crossings: {''ion'': 0.622, ''ion_negative'': 0.002, ''water'': 0.097} — leader
      ion with a 6.4× margin over second'
